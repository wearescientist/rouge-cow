<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 音频系统测试</title>
    <script src="../systems/AudioSystem.js"></script>
    <script src="../systems/AudioController.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #4eccff;
            margin-bottom: 30px;
        }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .section h2 {
            color: #ffd700;
            margin-bottom: 15px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        button.bgm {
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
        }
        button.ui {
            background: linear-gradient(90deg, #4ecca3 0%, #3db892 100%);
        }
        button.weapon {
            background: linear-gradient(90deg, #fa709a 0%, #fee140 100%);
        }
        button.hit {
            background: linear-gradient(90deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
        }
        .status {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .status.ready { color: #4ecca3; }
        .status.error { color: #f5576c; }
        .log {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log div { margin: 3px 0; }
        .log .error { color: #f5576c; }
        .log .success { color: #4ecca3; }
    </style>
</head>
<body>
    <h1>🎵 音频系统测试</h1>
    
    <div class="status" id="status">
        点击任意按钮初始化音频系统
    </div>
    
    <div class="section">
        <h2>🎵 BGM控制</h2>
        <div class="btn-grid">
            <button class="bgm" onclick="playBGM('menu')">Menu</button>
            <button class="bgm" onclick="playBGM('normal')">Normal</button>
            <button class="bgm" onclick="playBGM('elite')">Elite</button>
            <button class="bgm" onclick="playBGM('boss')">Boss</button>
            <button class="bgm" onclick="playBGM('victory')">Victory</button>
            <button onclick="stopBGM()">Stop BGM</button>
        </div>
    </div>
    
    <div class="section">
        <h2>🔊 UI音效</h2>
        <div class="btn-grid">
            <button class="ui" onclick="play('click')">Click</button>
            <button class="ui" onclick="play('select')">Select</button>
            <button class="ui" onclick="play('switch')">Switch</button>
            <button class="ui" onclick="play('levelup')">Level Up</button>
            <button class="ui" onclick="play('coin')">Coin</button>
            <button class="ui" onclick="play('chest')">Chest</button>
            <button class="ui" onclick="play('heal')">Heal</button>
            <button class="ui" onclick="play('evolve')">Evolve</button>
            <button class="ui" onclick="play('bossEnter')">Boss Enter</button>
        </div>
    </div>
    
    <div class="section">
        <h2>⚔️ 武器音效</h2>
        <div class="btn-grid">
            <button class="weapon" onclick="playWeapon('whip')">Whip</button>
            <button class="weapon" onclick="playWeapon('scythe')">Scythe</button>
            <button class="weapon" onclick="playWeapon('knife')">Knife</button>
            <button class="weapon" onclick="playWeapon('axe')">Axe</button>
            <button class="weapon" onclick="playWeapon('cross')">Cross</button>
            <button class="weapon" onclick="playWeapon('wand')">Wand</button>
            <button class="weapon" onclick="playWeapon('fireball')">Fireball</button>
            <button class="weapon" onclick="playWeapon('shuriken')">Shuriken</button>
            <button class="weapon" onclick="playWeapon('icicle')">Icicle</button>
            <button class="weapon" onclick="playWeapon('lightning')">Lightning</button>
            <button class="weapon" onclick="playWeapon('laser')">Laser</button>
            <button class="weapon" onclick="playWeapon('dart')">Dart</button>
        </div>
    </div>
    
    <div class="section">
        <h2>💥 命中音效</h2>
        <div class="btn-grid">
            <button class="hit" onclick="playHit('bird')">Bird</button>
            <button class="hit" onclick="playHit('fur')">Fur</button>
            <button class="hit" onclick="playHit('shell')">Shell</button>
            <button class="hit" onclick="playHit('slime')">Slime</button>
            <button class="hit" onclick="playHit('bone')">Bone</button>
            <button class="hit" onclick="playHit('flesh')">Flesh</button>
            <button onclick="playCrit()">Crit</button>
        </div>
    </div>
    
    <div class="section">
        <h2>🎮 游戏事件</h2>
        <div class="btn-grid">
            <button onclick="play('dash')">Dash</button>
            <button onclick="play('gem')">Gem</button>
            <button onclick="play('kill')">Kill</button>
            <button onclick="play('hurt')">Hurt</button>
            <button onclick="play('gameover')">Game Over</button>
            <button onclick="play('portal')">Portal</button>
        </div>
    </div>
    
    <div class="log" id="log">
        <div>等待初始化...</div>
    </div>

    <script>
        let audio, audioCtrl;
        let initialized = false;
        
        function log(msg, isError = false) {
            const logEl = document.getElementById('log');
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.className = isError ? 'error' : 'success';
            logEl.insertBefore(div, logEl.firstChild);
        }
        
        function init() {
            if (initialized) return;
            
            try {
                // 创建模拟game对象
                const mockGame = { audio: null };
                
                audio = new AudioSystem();
                const success = audio.init();
                
                if (!success) {
                    throw new Error('AudioSystem初始化失败');
                }
                
                mockGame.audio = audio;
                audioCtrl = new AudioController(mockGame);
                
                document.getElementById('status').textContent = '✅ 音频系统已就绪';
                document.getElementById('status').className = 'status ready';
                
                log('音频系统初始化成功');
                initialized = true;
                
            } catch (e) {
                document.getElementById('status').textContent = '❌ 初始化失败: ' + e.message;
                document.getElementById('status').className = 'status error';
                log('初始化失败: ' + e.message, true);
            }
        }
        
        function playBGM(type) {
            init();
            if (!initialized) return;
            audioCtrl.playBGM(type);
            log(`播放BGM: ${type}`);
        }
        
        function stopBGM() {
            if (!initialized) return;
            audioCtrl.stopBGM();
            log('停止BGM');
        }
        
        function play(type) {
            init();
            if (!initialized) return;
            audioCtrl.play(type);
            log(`播放音效: ${type}`);
        }
        
        function playWeapon(type) {
            init();
            if (!initialized) return;
            audioCtrl.playWeapon(type);
            log(`播放武器: ${type}`);
        }
        
        function playHit(material) {
            init();
            if (!initialized) return;
            audioCtrl.playHit(material);
            log(`播放命中: ${material}`);
        }
        
        function playCrit() {
            init();
            if (!initialized) return;
            audioCtrl.playCrit();
            log('播放暴击音效');
        }
    </script>
</body>
</html>
