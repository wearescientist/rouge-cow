<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 音效配置详细检查</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        h1 { color: #4eccff; text-align: center; margin-bottom: 20px; }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 { color: #ffd700; margin-bottom: 15px; font-size: 18px; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            text-align: left;
            color: #4eccff;
        }
        td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .ok { color: #4ecca3; }
        .error { color: #ff6b6b; }
        .warn { color: #ffd700; }
        code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: Consolas, monospace;
            font-size: 12px;
        }
        .btn {
            padding: 10px 20px;
            background: linear-gradient(90deg, #4ecca3, #3db892);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>🔍 音效配置详细检查</h1>
    
    <div class="section">
        <h2>🎮 游戏中的音效调用</h2>
        <table id="callTable">
            <tr>
                <th>调用代码</th>
                <th>位置</th>
                <th>实际执行</th>
                <th>状态</th>
            </tr>
        </table>
    </div>

    <div class="section">
        <h2>⚔️ 武器音效映射</h2>
        <table id="weaponTable">
            <tr>
                <th>武器ID</th>
                <th>映射音效</th>
                <th>文件名</th>
                <th>状态</th>
            </tr>
        </table>
    </div>

    <div class="section">
        <h2>💥 命中音效映射</h2>
        <table id="hitTable">
            <tr>
                <th>材质</th>
                <th>普通音效</th>
                <th>暴击音效</th>
            </tr>
        </table>
    </div>

    <div class="section">
        <h2>🎛️ 通用播放接口映射</h2>
        <div class="warn" style="margin-bottom: 15px;">
            play() 方法中的映射 - 这是问题所在！
        </div>
        <table id="playMapTable">
            <tr>
                <th>play() 参数</th>
                <th>映射到</th>
                <th>说明</th>
            </tr>
        </table>
    </div>

    <script>
        // 配置数据
        const config = {
            weapons: {
                whip: 'whip_crack_Sharp_lea_#3-1772638713348.mp3',
                scythe: 'Heavy_scythe_slash_#2-1772638772954.mp3',
                knife: 'knife_throw_v1.mp3',
                axe: 'axe_throw_v1.mp3',
                cross: 'cross_launch_v1.mp3',
                wand: 'wand_cast_v1.mp3',
                fireball: 'fireball_v1.mp3',
                shuriken: 'shuriken_v2.mp3',
                icicle: 'icicle_v2.mp3',
                lightning: 'lighting.ogg',
                laser: 'laser2.ogg',
                dart: 'dart_shoot_v2.mp3'
            },
            hits: {
                bird: { prefix: 'impactBell_light', count: 1, heavyPrefix: 'impactBell_heavy' },
                fur: { prefix: 'impactSoft_medium', count: 5, heavyPrefix: 'impactSoft_heavy' },
                shell: { prefix: 'impactBell_light', count: 1, heavyPrefix: 'impactBell_heavy' },
                slime: { prefix: 'impactGeneric_light', count: 4, heavyPrefix: 'impactGeneric_light' },
                bone: { prefix: 'impactWood_light', count: 5, heavyPrefix: 'impactWood_heavy' },
                flesh: { prefix: 'impactSoft_medium', count: 5, heavyPrefix: 'impactSoft_heavy' }
            }
        };

        // play() 方法的映射
        const playMappings = {
            'whip': 'playWeapon("whip")',
            'scythe': 'playWeapon("scythe")',
            'knife': 'playWeapon("knife")',
            'axe': 'playWeapon("axe")',
            'cross': 'playWeapon("cross")',
            'wand': 'playWeapon("wand")',
            'fireball': 'playWeapon("fireball")',
            'shuriken': 'playWeapon("shuriken")',
            'icicle': 'playWeapon("icicle")',
            'poison': 'playWeapon("dart")',
            'lightning': 'playWeapon("lightning")',
            'holywater': 'playWeapon("wand")',
            'laser': 'playWeapon("laser")',
            'dart': 'playWeapon("dart")',
            'shoot': 'playWeapon("whip") ⚠️ 固定为鞭子！',
            'hit': 'playHit("flesh")',
            'crit': 'playCrit()',
            'dash': 'playDash()',
            'explosion': 'playExplosion()',
            'levelup': 'playLevelUp()',
            'gameover': 'playGameOver()',
            'warning': 'playWarning()',
            'evolve': 'playEvolve()',
            'chest': 'playChest()',
            'unlock': 'playUnlock()',
            'coin': 'playCoin()',
            'heal': 'playHeal()',
            'gem': 'playGem()',
            'kill': 'playKill()',
            'buy': 'playBuy()',
            'hurt': 'playHurt()'
        };

        // 游戏中的调用
        const gameCalls = [
            { code: 'play(sfxType)', loc: 'Pet.attack() ~4567', actual: '根据宠物类型', status: 'ok' },
            { code: 'playHit()', loc: 'Enemy.update() ~7368', actual: 'playHit("flesh") 默认', status: 'warn' },
            { code: 'playDash()', loc: 'Player.dash() ~7428', actual: 'playDash()', status: 'ok' },
            { code: 'play("warning")', loc: 'Enemy.charge() ~7482', actual: 'playWarning()', status: 'ok' },
            { code: 'playExplosion()', loc: 'Bullet.explode() ~7502', actual: 'playExplosion()', status: 'ok' },
            { code: 'play("shoot")', loc: '多处 ~7519,7537', actual: 'playWeapon("whip") ⚠️', status: 'error' },
            { code: 'playCrit()', loc: 'Damage.apply() ~8042', actual: 'playCrit()', status: 'ok' },
            { code: 'playHit(material)', loc: 'Damage.apply() ~8046', actual: '根据敌人材质', status: 'ok' },
            { code: 'playLevelUp()', loc: 'Game ~13034', actual: 'playLevelUp()', status: 'ok' },
            { code: 'play("evolve")', loc: 'Game ~15054', actual: 'playEvolve()', status: 'ok' },
            { code: 'play("chest")', loc: 'Game ~15306', actual: 'playChest()', status: 'ok' },
            { code: 'play("buy")', loc: 'Game ~15772', actual: 'playBuy()', status: 'ok' },
            { code: 'play("gem")', loc: 'Game ~15903', actual: 'playGem()', status: 'ok' },
            { code: 'playBGM()', loc: '多处', actual: 'BGM切换', status: 'ok' }
        ];

        // 填充表格
        function fillTables() {
            // 游戏调用
            const callTable = document.getElementById('callTable');
            for (const call of gameCalls) {
                const row = callTable.insertRow();
                const statusClass = call.status === 'ok' ? 'ok' : call.status === 'warn' ? 'warn' : 'error';
                row.innerHTML = `
                    <td><code>${call.code}</code></td>
                    <td>${call.loc}</td>
                    <td>${call.actual}</td>
                    <td class="${statusClass}">${call.status === 'ok' ? '✓' : call.status === 'warn' ? '⚠' : '✗'}</td>
                `;
            }

            // 武器映射
            const weaponTable = document.getElementById('weaponTable');
            for (const [id, file] of Object.entries(config.weapons)) {
                const row = weaponTable.insertRow();
                row.innerHTML = `
                    <td><code>${id}</code></td>
                    <td>${id}</td>
                    <td>${file}</td>
                    <td class="ok">✓</td>
                `;
            }

            // 命中映射
            const hitTable = document.getElementById('hitTable');
            for (const [mat, cfg] of Object.entries(config.hits)) {
                const row = hitTable.insertRow();
                row.innerHTML = `
                    <td><code>${mat}</code></td>
                    <td>${cfg.prefix}_xxx.ogg (${cfg.count}个)</td>
                    <td>${cfg.heavyPrefix}_xxx.ogg</td>
                `;
            }

            // play() 映射
            const playTable = document.getElementById('playMapTable');
            for (const [key, val] of Object.entries(playMappings)) {
                const row = playTable.insertRow();
                const isProblem = val.includes('⚠');
                row.innerHTML = `
                    <td><code>play("${key}")</code></td>
                    <td>${val.replace(' ⚠️ 固定为鞭子！', '')}</td>
                    <td class="${isProblem ? 'error' : ''}">${isProblem ? '❌ 问题：所有shoot都变成鞭子' : '✓'}</td>
                `;
            }
        }

        fillTables();
    </script>
</body>
</html>
