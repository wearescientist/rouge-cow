<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深根之疫 - v0.23 新架构测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { 
            width: 100%; height: 100%; 
            background: #0a0a14; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameCanvas { 
            display: block; 
            background: #0d0d1a;
            border: 2px solid #333;
        }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a14; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
            color: #fff; font-family: Arial, sans-serif;
        }
        #loading.hidden { display: none; }
        .loading-text { color: #4488ff; font-size: 24px; margin-bottom: 20px; }
        .loading-bar { width: 300px; height: 12px; background: #222; border-radius: 6px; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: linear-gradient(90deg, #4488ff, #8cf); transition: width 0.3s; }
        #ui {
            position: fixed; top: 10px; left: 10px;
            color: #fff; font-family: monospace; font-size: 14px;
            pointer-events: none;
        }
        .fps-good { color: #4f4; }
        .fps-bad { color: #f44; }
        #controls {
            position: fixed; bottom: 10px; left: 10px;
            color: #888; font-family: monospace; font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- 加载画面 -->
    <div id="loading">
        <div class="loading-text">🐮 深根之疫 v0.23 - 新架构加载中...</div>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
        <div style="color: #666; margin-top: 15px; font-size: 14px;">
            正在初始化 ECS 架构 | 数据驱动 | 行为树 AI
        </div>
    </div>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas" width="900" height="600"></canvas>

    <!-- UI 信息显示 -->
    <div id="ui">
        <div>FPS: <span id="fps" class="fps-good">60</span></div>
        <div>Entities: <span id="entityCount">0</span></div>
        <div>Camera: <span id="cameraPos">0, 0</span></div>
        <div>QuadTree: <span id="quadStats">0</span></div>
        <div style="margin-top: 10px; color: #4f4;">✅ v0.23 新架构运行中</div>
    </div>

    <!-- 控制说明 -->
    <div id="controls">
        WASD/方向键: 移动 | 空格: 冲刺 | 点击: 生成敌人 | ESC: 暂停
    </div>

    <!-- 核心工具类 -->
    <script src="src/utils/EventManager.js"></script>
    <script src="src/utils/Logger.js"></script>
    
    <!-- ECS 架构 -->
    <script src="src/ecs/Component.js"></script>
    <script src="src/ecs/components/TransformComponent.js"></script>
    <script src="src/ecs/components/HealthComponent.js"></script>
    <script src="src/ecs/System.js"></script>
    <script src="src/ecs/World.js"></script>
    
    <!-- 核心系统 -->
    <script src="src/core/DataManager.js"></script>
    <script src="src/core/StateManager.js"></script>
    <script src="src/core/AssetManager.js"></script>
    <script src="src/core/PerformanceMonitor.js"></script>
    <script src="src/core/ObjectPool.js"></script>
    <script src="src/core/QuadTree.js"></script>
    <script src="src/core/Camera.js"></script>
    
    <!-- AI 系统 -->
    <script src="src/ai/BehaviorTree.js"></script>
    <script src="src/ai/EnemyAI.js"></script>
    
    <!-- 游戏主类 -->
    <script src="src/game.js"></script>

    <script>
        // 加载进度更新
        const modules = [
            'EventManager', 'Logger',
            'Component', 'TransformComponent', 'HealthComponent',
            'System', 'World',
            'DataManager', 'StateManager', 'AssetManager', 'PerformanceMonitor',
            'ObjectPool', 'ParticlePool', 'BulletPool',
            'QuadTree', 'Camera',
            'BTNode', 'NodeStatus', 'Selector', 'Sequence', 'Action', 'Condition',
            'EnemyAI',
            'GameV23'
        ];

        function updateLoading(progress) {
            document.getElementById('loadingProgress').style.width = progress + '%';
        }

        function checkLoaded() {
            let loaded = 0;
            modules.forEach(name => {
                if (window[name] !== undefined) loaded++;
            });
            
            const progress = (loaded / modules.length) * 100;
            updateLoading(progress);
            
            if (loaded >= modules.length) {
                setTimeout(initGame, 500);
            } else {
                setTimeout(checkLoaded, 100);
            }
        }

        // 开始检查
        setTimeout(checkLoaded, 100);

        let game;

        async function initGame() {
            console.log('[V23] 所有模块加载完成，初始化游戏...');
            
            const canvas = document.getElementById('gameCanvas');
            
            // 创建游戏实例
            game = new GameV23(canvas);
            
            // 等待初始化
            await waitForInit();
            
            // 隐藏加载画面
            document.getElementById('loading').classList.add('hidden');
            
            // 创建玩家
            const player = game.createPlayer(0, 0);
            
            // 创建一些测试敌人
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const dist = 150;
                game.createEnemy(
                    Math.cos(angle) * dist,
                    Math.sin(angle) * dist,
                    'rabbit_t1'
                );
            }
            
            // 启动游戏
            game.start();
            
            // 启动UI更新
            updateUI();
            
            // 绑定点击生成敌人
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (900 / rect.width);
                const y = (e.clientY - rect.top) * (600 / rect.height);
                
                const worldPos = game.camera.screenToWorld(x, y);
                game.createEnemy(worldPos.x, worldPos.y, 'rabbit_t1');
            });

            console.log('[V23] 游戏初始化完成！');
        }

        function waitForInit() {
            return new Promise(resolve => {
                const check = () => {
                    if (game && game.state !== 'loading') {
                        resolve();
                    } else {
                        setTimeout(check, 100);
                    }
                };
                check();
            });
        }

        function updateUI() {
            if (!game) return;
            
            // 更新 FPS
            const fps = Math.round(game.perfMonitor.fps);
            const fpsEl = document.getElementById('fps');
            fpsEl.textContent = fps;
            fpsEl.className = fps >= 50 ? 'fps-good' : (fps >= 30 ? '' : 'fps-bad');
            
            // 更新实体数
            const stats = game.world.getStats();
            document.getElementById('entityCount').textContent = stats.entities;
            
            // 更新相机位置
            document.getElementById('cameraPos').textContent = 
                `${Math.round(game.camera.x)}, ${Math.round(game.camera.y)}`;
            
            // 更新四叉树统计
            const qtStats = game.quadTree.getStats();
            document.getElementById('quadStats').textContent = 
                `${qtStats.count} (depth:${qtStats.depth})`;
            
            requestAnimationFrame(updateUI);
        }

        // 键盘控制（简单实现）
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            
            if (e.key === 'Escape') {
                if (game.state === 'playing') {
                    game.pause();
                } else if (game.state === 'paused') {
                    game.resume();
                }
            }
        });
        window.addEventListener('keyup', e => keys[e.key] = false);

        // 简单的玩家移动控制
        setInterval(() => {
            if (!game || game.state !== 'playing') return;
            
            const playerEntities = game.world.query([TransformComponent])
                .filter(e => e.hasTag('player'));
            
            if (playerEntities.length === 0) return;
            
            const transform = playerEntities[0].get(TransformComponent);
            const speed = 150 * (1/60); // 假设60fps
            
            if (keys['w'] || keys['W'] || keys['ArrowUp']) transform.y -= speed;
            if (keys['s'] || keys['S'] || keys['ArrowDown']) transform.y += speed;
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) transform.x -= speed;
            if (keys['d'] || keys['D'] || keys['ArrowRight']) transform.x += speed;
        }, 1000/60);
    </script>
</body>
</html>
