<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪物 & 玩家 游戏比例对比</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a14;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 8px;
            font-size: 24px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 13px;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            font-size: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }
        
        .dot-original { background: #666; }
        .dot-v1 { background: #4ecdc4; }
        .dot-v2 { background: #ff8844; }
        .dot-v3 { background: #9b59b6; }
        .dot-v1b { background: #e74c3c; }
        .dot-player { background: #3498db; }
        
        .view-modes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a3e;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        button:hover { background: #3a3a4e; }
        button.active { background: #4a4a6e; border-color: #ffd700; color: #ffd700; }
        
        /* 游戏比例对比视图 */
        .game-scale-view {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .scale-title {
            text-align: center;
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 12px;
            padding: 8px;
            background: rgba(255,215,0,0.1);
            border-radius: 6px;
        }
        
        .scale-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .scale-card {
            background: #1a1a2a;
            border-radius: 10px;
            padding: 12px;
            border: 2px solid transparent;
        }
        
        .scale-card.original { border-color: #666; }
        .scale-card.v1 { border-color: #4ecdc4; }
        .scale-card.v2 { border-color: #ff8844; }
        .scale-card.v3 { border-color: #9b59b6; }
        .scale-card.v1b { border-color: #e74c3c; }
        
        .scale-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .scale-card-title {
            font-size: 13px;
            font-weight: bold;
        }
        
        .scale-card-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            background: #333;
        }
        
        .scale-card.original .scale-card-title { color: #999; }
        .scale-card.v1 .scale-card-title { color: #4ecdc4; }
        .scale-card.v2 .scale-card-title { color: #ff8844; }
        .scale-card.v3 .scale-card-title { color: #9b59b6; }
        .scale-card.v1b .scale-card-title { color: #e74c3c; }
        
        .scale-canvas-wrapper {
            background: linear-gradient(180deg, #0f0f1e 0%, #050510 100%);
            border-radius: 6px;
            position: relative;
            height: 150px;
            overflow: hidden;
            border: 1px solid #333;
        }
        
        .scale-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        .scale-info {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 10px;
            color: #666;
        }
        
        /* 单版本大图对比 */
        .single-compare-view {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        
        .single-compare-view.active { display: block; }
        
        .compare-canvas-wrapper {
            background: linear-gradient(180deg, #1a1a2e 0%, #0a0a1e 100%);
            border-radius: 12px;
            padding: 20px;
            display: inline-block;
            border: 1px solid #333;
        }
        
        #compareCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        .compare-info {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 12px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        
        /* 版本选择 */
        .version-tabs {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 6px 12px;
            border: none;
            background: #2a2a3e;
            color: #888;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { background: #3a3a4e; color: #fff; }
        
        /* 怪物选择 */
        .monster-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }
        
        .section-title {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 12px;
        }
        
        .monster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 6px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .monster-btn {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1a1a2a;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
            text-align: center;
        }
        
        .monster-btn:hover {
            border-color: #555;
            color: #fff;
        }
        
        .monster-btn.active {
            border-color: #ffd700;
            background: #2a2a3e;
            color: #ffd700;
        }
        
        .help-text {
            text-align: center;
            color: #555;
            font-size: 11px;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>🎮 怪物 & 玩家 游戏比例对比</h1>
    <p class="subtitle">按游戏内实际渲染尺寸 | 玩家 40px | 怪物 30-45px | feet-on-ground 对齐</p>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot dot-player"></div>
            <span>玩家 40px</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot dot-original"></div>
            <span>Original</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot dot-v1"></div>
            <span>V1 色彩</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot dot-v2"></div>
            <span>V2 阴影</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot dot-v3"></div>
            <span>V3 综合</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot dot-v1b"></div>
            <span>V1b 实装</span>
        </div>
    </div>
    
    <div class="view-modes">
        <button id="btnGameScale" class="active">🎮 游戏比例对比</button>
        <button id="btnSingle">🔍 单版本大图</button>
    </div>
    
    <!-- 游戏比例对比视图 -->
    <div id="gameScaleView" class="game-scale-view">
        <div class="scale-title">
            👤 玩家 (40px) vs 🐾 <span id="currentMonsterName">小蝙蝠</span> (<span id="currentMonsterSize">28</span>px)
        </div>
        <div class="scale-grid" id="scaleGrid"></div>
    </div>
    
    <!-- 单版本大图对比 -->
    <div id="singleView" class="single-compare-view">
        <div class="version-tabs">
            <button class="tab-btn" data-version="original">Original</button>
            <button class="tab-btn" data-version="v1">V1</button>
            <button class="tab-btn" data-version="v2">V2</button>
            <button class="tab-btn" data-version="v3">V3</button>
            <button class="tab-btn active" data-version="v1b" style="color: #e74c3c;">V1b(实装)</button>
        </div>
        <div class="compare-canvas-wrapper">
            <canvas id="compareCanvas" width="500" height="280"></canvas>
        </div>
        <div class="compare-info">
            <div class="info-item">
                <span class="dot" style="background: #3498db;"></span>
                <span>玩家 40px</span>
            </div>
            <div class="info-item">
                <span class="dot" id="monsterDot" style="background: #e74c3c;"></span>
                <span id="monsterInfo">小蝙蝠 28px</span>
            </div>
        </div>
    </div>
    
    <!-- 怪物选择 -->
    <div class="monster-section">
        <div class="section-title">选择怪物（第一层全部18种，按实际游戏尺寸）</div>
        <div class="monster-grid" id="monsterList"></div>
    </div>
    
    <div class="help-text">
        <p>游戏内实际渲染：玩家默认 40px，怪物按类型 30-45px 不等</p>
        <p>所有对比均按 feet-on-ground（脚底对齐）方式绘制</p>
    </div>

    <script>
        // v0.34: 怪物体型配置 (small=28, medium=36, large=44, huge=88)
        const MONSTER_SIZE_MAP = {
            'bat_v2': 28, 'bat_v3': 28, 'chick_spr': 28, 'crab_v4': 28, 'fox_v1': 44, 'fox_v3': 44,
            'ghost_v3': 44, 'ghost_v4': 44, 'mimic_v1': 36, 'mimic_v5': 36, 'panther_v1': 44,
            'pigeon_v1': 28, 'pigeon_v4': 28, 'rabbit2_v2': 36, 'rabbit2_v4': 88, 'snail_v1': 28,
            'snail_v4': 28, 'snake_v4': 28
        };
        
        // 第一层怪物
        const monsters = [
            { id: 'bat_v2', name: '小蝙蝠' },
            { id: 'bat_v3', name: '吸血蝙蝠' },
            { id: 'chick_spr', name: '变异小鸡' },
            { id: 'crab_v4', name: '铁甲蟹' },
            { id: 'fox_v1', name: '幼狐' },
            { id: 'fox_v3', name: '狡猾狐狸' },
            { id: 'ghost_v3', name: '怨灵' },
            { id: 'ghost_v4', name: '恶灵' },
            { id: 'mimic_v1', name: '宝箱怪' },
            { id: 'mimic_v5', name: '守卫宝箱怪' },
            { id: 'panther_v1', name: '幼豹' },
            { id: 'pigeon_v1', name: '变异鸽子' },
            { id: 'pigeon_v4', name: '毒鸽' },
            { id: 'rabbit2_v2', name: '疯兔' },
            { id: 'rabbit2_v4', name: '暴徒兔' },
            { id: 'snail_v1', name: '蜗牛' },
            { id: 'snail_v4', name: '铁壳蜗牛' },
            { id: 'snake_v4', name: '毒蛇' },
        ];
        
        const versions = {
            original: { name: 'Original', path: 'monster_walk_curated_by_floor_reworked_v2', color: '#999' },
            v1: { name: 'V1 色彩', path: 'monster_walk_curated_by_floor_reworked_v2_styled', color: '#4ecdc4' },
            v2: { name: 'V2 阴影', path: 'monster_walk_curated_by_floor_reworked_v2_hd2d', color: '#ff8844' },
            v3: { name: 'V3 综合', path: 'monster_walk_curated_by_floor_reworked_v2_hd2d_v3', color: '#9b59b6' },
            v1b: { name: 'V1b 实装', path: 'monster_walk_curated_by_floor_reworked_v2_v1b_final', color: '#e74c3c' }
        };
        
        // 游戏内尺寸设置
        const PLAYER_SIZE = 40;  // 玩家默认 40px
        const SCALE_FACTOR = 2.5; // 显示放大倍数
        
        let currentMonster = monsters[0];
        let currentView = 'gameScale';
        let currentSingleVersion = 'v1b';
        let playerImage = null;
        
        // 解析ID
        function parseId(id) {
            const parts = id.split('_');
            const version = parts.pop();
            return { baseId: parts.join('_'), version };
        }
        
        // 构建怪物路径
        function buildMonsterPath(monsterId, versionKey) {
            const { baseId, version } = parseId(monsterId);
            return `../generated_assets/${versions[versionKey].path}/floor1/${baseId}/${version}/walk/f01.png`;
        }
        
        // 加载图片
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error(src));
                img.src = src;
            });
        }
        
        // 初始化加载玩家图片 (variants_40x40/player_idle_0_crop_40.png)
        async function loadPlayerImage() {
            try {
                playerImage = await loadImage('../assets/sprites/player/variants_40x40/player_idle_0_crop_40.png');
            } catch (e) {
                console.error('Player image load failed:', e);
            }
        }
        
        // 绘制游戏比例对比画布
        function drawGameScaleCanvas(canvas, playerImg, monsterImg, monsterSize) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // 清空画布
            ctx.clearRect(0, 0, width, height);
            
            // 地面线 (y = height - 20)
            const groundY = height - 20;
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(width, groundY);
            ctx.stroke();
            
            // 计算绘制尺寸（按游戏比例）
            const playerDrawSize = PLAYER_SIZE * SCALE_FACTOR;
            const monsterDrawSize = monsterSize * SCALE_FACTOR;
            
            // 玩家位置（偏左）
            const playerX = width * 0.3;
            const playerY = groundY - playerDrawSize;
            
            // 怪物位置（偏右）
            const monsterX = width * 0.7;
            const monsterY = groundY - monsterDrawSize;
            
            // 绘制玩家（脚底对齐）
            if (playerImg) {
                ctx.save();
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(playerImg, playerX - playerDrawSize/2, playerY, playerDrawSize, playerDrawSize);
                ctx.restore();
            }
            
            // 绘制怪物（脚底对齐）
            if (monsterImg) {
                ctx.save();
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(monsterImg, monsterX - monsterDrawSize/2, monsterY, monsterDrawSize, monsterDrawSize);
                ctx.restore();
            }
            
            // 尺寸标注线
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(playerX - playerDrawSize/2 - 5, playerY);
            ctx.lineTo(playerX - playerDrawSize/2 - 5, groundY);
            ctx.moveTo(monsterX + monsterDrawSize/2 + 5, monsterY);
            ctx.lineTo(monsterX + monsterDrawSize/2 + 5, groundY);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        // 创建游戏比例对比卡片
        async function createScaleCards() {
            const grid = document.getElementById('scaleGrid');
            grid.innerHTML = '';
            
            const versionKeys = ['original', 'v1', 'v2', 'v3', 'v1b'];
            
            for (const key of versionKeys) {
                const card = document.createElement('div');
                card.className = `scale-card ${key}`;
                
                const isCurrent = key === 'v1b';
                
                card.innerHTML = `
                    <div class="scale-card-header">
                        <span class="scale-card-title">${versions[key].name}</span>
                        ${isCurrent ? '<span class="scale-card-badge" style="background: #e74c3c; color: #fff;">实装</span>' : ''}
                    </div>
                    <div class="scale-canvas-wrapper">
                        <canvas class="scale-canvas" id="scaleCanvas_${key}" width="200" height="150"></canvas>
                    </div>
                    <div class="scale-info">
                        <span>👤 40px</span>
                        <span>🐾 ${MONSTER_SIZE_MAP[currentMonster.id] || 36}px</span>
                    </div>
                `;
                
                grid.appendChild(card);
                
                // 加载并绘制
                try {
                    const monsterPath = buildMonsterPath(currentMonster.id, key);
                    const monsterImg = await loadImage(monsterPath);
                    const canvas = document.getElementById(`scaleCanvas_${key}`);
                    drawGameScaleCanvas(canvas, playerImage, monsterImg, MONSTER_SIZE_MAP[currentMonster.id] || 36);
                } catch (e) {
                    console.error(`Failed to load ${key}:`, e);
                }
            }
        }
        
        // 绘制单版本大图对比
        async function drawSingleCompare() {
            const canvas = document.getElementById('compareCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const groundY = height - 40;
            
            // 清空
            ctx.clearRect(0, 0, width, height);
            
            // 背景
            ctx.fillStyle = '#0f0f1e';
            ctx.fillRect(0, 0, width, height);
            
            // 地面
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.fillRect(0, groundY, width, height - groundY);
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(width, groundY);
            ctx.stroke();
            
            // 加载怪物
            try {
                const monsterPath = buildMonsterPath(currentMonster.id, currentSingleVersion);
                const monsterImg = await loadImage(monsterPath);
                
                // 绘制尺寸（放大显示）
                const scale = 4;
                const playerDrawSize = PLAYER_SIZE * scale;
                const monsterDrawSize = (MONSTER_SIZE_MAP[currentMonster.id] || 36) * scale;
                
                // 玩家位置
                const playerX = width * 0.3;
                const playerY = groundY - playerDrawSize;
                
                // 怪物位置
                const monsterX = width * 0.7;
                const monsterY = groundY - monsterDrawSize;
                
                // 绘制玩家
                if (playerImage) {
                    ctx.save();
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(playerImage, playerX - playerDrawSize/2, playerY, playerDrawSize, playerDrawSize);
                    ctx.restore();
                    
                    // 标签
                    ctx.fillStyle = '#3498db';
                    ctx.font = 'bold 13px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('👤 玩家', playerX, playerY - 10);
                    ctx.font = '11px sans-serif';
                    ctx.fillStyle = '#888';
                    ctx.fillText('40px', playerX, playerY + playerDrawSize + 15);
                }
                
                // 绘制怪物
                ctx.save();
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(monsterImg, monsterX - monsterDrawSize/2, monsterY, monsterDrawSize, monsterDrawSize);
                ctx.restore();
                
                // 怪物标签
                const versionColor = versions[currentSingleVersion].color;
                ctx.fillStyle = versionColor;
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`🐾 ${currentMonster.name}`, monsterX, monsterY - 10);
                ctx.font = '11px sans-serif';
                ctx.fillStyle = '#888';
                ctx.fillText(`${MONSTER_SIZE_MAP[currentMonster.id] || 36}px`, monsterX, monsterY + monsterDrawSize + 15);
                
            } catch (e) {
                console.error('Load failed:', e);
            }
        }
        
        // 切换怪物
        async function switchMonster(monster) {
            currentMonster = monster;
            document.getElementById('currentMonsterName').textContent = monster.name;
            document.getElementById('currentMonsterSize').textContent = MONSTER_SIZE_MAP[monster.id] || 36;
            document.getElementById('monsterInfo').textContent = `${monster.name} ${MONSTER_SIZE_MAP[monster.id] || 36}px`;
            
            document.querySelectorAll('.monster-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.id === monster.id);
            });
            
            if (currentView === 'gameScale') {
                await createScaleCards();
            } else {
                await drawSingleCompare();
            }
        }
        
        // 切换视图
        function switchView(view) {
            currentView = view;
            
            document.getElementById('gameScaleView').style.display = view === 'gameScale' ? 'block' : 'none';
            document.getElementById('singleView').classList.toggle('active', view === 'single');
            
            document.querySelectorAll('.view-modes button').forEach(btn => {
                btn.classList.toggle('active', btn.id === `btn${view.charAt(0).toUpperCase() + view.slice(1)}`);
            });
            
            if (view === 'gameScale') {
                createScaleCards();
            } else {
                drawSingleCompare();
            }
        }
        
        // 初始化
        async function init() {
            await loadPlayerImage();
            
            // 怪物按钮
            const list = document.getElementById('monsterList');
            monsters.forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'monster-btn';
                btn.textContent = `${m.name} (${m.size}px)`;
                btn.dataset.id = m.id;
                if (m.id === currentMonster.id) btn.classList.add('active');
                btn.onclick = () => switchMonster(m);
                list.appendChild(btn);
            });
            
            // 视图切换
            document.getElementById('btnGameScale').onclick = () => switchView('gameScale');
            document.getElementById('btnSingle').onclick = () => switchView('single');
            
            // 单视图版本切换
            document.querySelectorAll('#singleView .tab-btn').forEach(btn => {
                btn.onclick = () => {
                    currentSingleVersion = btn.dataset.version;
                    document.querySelectorAll('#singleView .tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('monsterDot').style.background = versions[currentSingleVersion].color;
                    drawSingleCompare();
                };
            });
            
            // 初始加载
            await createScaleCards();
        }
        
        init();
    </script>
</body>
</html>
