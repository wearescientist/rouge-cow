<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪物贴图风格优化预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #ffd700;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        label {
            font-size: 14px;
            color: #aaa;
        }
        
        select, button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a3e;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        
        button {
            background: #4a4a6e;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #5a5a7e;
        }
        
        button.active {
            background: #6a6a9e;
            border-color: #ffd700;
        }
        
        .preview-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .preview-box {
            background: #0a0a1e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            min-width: 300px;
        }
        
        .preview-box h3 {
            margin-bottom: 15px;
            color: #aaa;
            font-size: 16px;
        }
        
        .preview-box.original h3 {
            color: #ff6b6b;
        }
        
        .preview-box.styled h3 {
            color: #4ecdc4;
        }
        
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            background: #151525;
            border-radius: 8px;
            padding: 20px;
        }
        
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        .info {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
        
        .monster-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .monster-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #333;
            background: #2a2a3e;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        
        .monster-btn:hover {
            border-color: #555;
            color: #fff;
        }
        
        .monster-btn.active {
            border-color: #ffd700;
            background: #3a3a4e;
            color: #ffd700;
        }
        
        .loading {
            color: #888;
            font-style: italic;
        }
        
        .error {
            color: #ff6b6b;
            font-size: 12px;
        }
        
        .comparison-mode {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .slider-container {
            position: relative;
            width: 600px;
            height: 400px;
            margin: 0 auto;
            display: none;
        }
        
        .slider-container.active {
            display: block;
        }
        
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 12px;
        }
        
        .slider-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        
        .slider-image.before {
            z-index: 1;
        }
        
        .slider-image.after {
            z-index: 2;
            width: 50%;
            border-right: 3px solid #ffd700;
        }
        
        .slider-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: #ffd700;
            cursor: ew-resize;
            z-index: 3;
            transform: translateX(-50%);
        }
        
        .slider-handle::after {
            content: '↔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background: #ffd700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #1a1a2e;
        }
    </style>
</head>
<body>
    <h1>🎨 怪物贴图风格优化预览</h1>
    <p class="subtitle">对比处理前后的效果 | 第一层 (Floor 1) | 共17套动画</p>
    
    <div class="controls">
        <div class="control-group">
            <label>播放速度:</label>
            <select id="speedSelect">
                <option value="200">慢速 (200ms)</option>
                <option value="125" selected>正常 (125ms)</option>
                <option value="80">快速 (80ms)</option>
            </select>
        </div>
        <div class="control-group">
            <label>显示比例:</label>
            <select id="scaleSelect">
                <option value="1">100%</option>
                <option value="2" selected>200%</option>
                <option value="3">300%</option>
                <option value="4">400%</option>
            </select>
        </div>
        <div class="control-group">
            <button id="playPauseBtn" class="active">⏸ 暂停</button>
        </div>
        <div class="control-group">
            <button id="viewModeBtn">📊 切换对比模式</button>
        </div>
    </div>
    
    <div class="comparison-mode">
        <button id="modeSideBySide" class="active">并排对比</button>
        <button id="modeSlider">拖拽对比</button>
    </div>
    
    <!-- 并排对比模式 -->
    <div id="sideBySideView" class="preview-container">
        <div class="preview-box original">
            <h3>🔴 原始版本 (Original)</h3>
            <div class="canvas-wrapper">
                <canvas id="canvasOriginal" width="256" height="256"></canvas>
            </div>
            <div class="info" id="infoOriginal">加载中...</div>
        </div>
        
        <div class="preview-box styled">
            <h3>🟢 优化版本 (Styled)</h3>
            <div class="canvas-wrapper">
                <canvas id="canvasStyled" width="256" height="256"></canvas>
            </div>
            <div class="info" id="infoStyled">加载中...</div>
        </div>
    </div>
    
    <!-- 拖拽对比模式 -->
    <div id="sliderView" class="slider-container">
        <div class="slider-wrapper" id="sliderWrapper">
            <div class="slider-image before" id="sliderBefore"></div>
            <div class="slider-image after" id="sliderAfter"></div>
            <div class="slider-handle" id="sliderHandle"></div>
        </div>
    </div>
    
    <div class="monster-list" id="monsterList">
        <!-- 动态生成怪物按钮 -->
    </div>

    <script>
        // 第一层怪物配置
        const floor1Monsters = [
            { id: 'bat_v2', name: '小蝙蝠 (v2)', frames: 4 },
            { id: 'bat_v3', name: '吸血蝙蝠 (v3)', frames: 3 },
            { id: 'chick_spr', name: '变异小鸡', frames: 4 },
            { id: 'crab_v4', name: '铁甲蟹 (v4)', frames: 2 },
            { id: 'fox_v1', name: '幼狐 (v1)', frames: 3 },
            { id: 'fox_v3', name: '狡猾狐狸 (v3)', frames: 3 },
            { id: 'ghost_v3', name: '怨灵 (v3)', frames: 3 },
            { id: 'ghost_v4', name: '恶灵 (v4)', frames: 3 },
            { id: 'mimic_v1', name: '宝箱怪 (v1)', frames: 4 },
            { id: 'mimic_v5', name: '守卫宝箱怪 (v5)', frames: 4 },
            { id: 'panther_v1', name: '幼豹 (v1)', frames: 3 },
            { id: 'pigeon_v1', name: '变异鸽子 (v1)', frames: 4 },
            { id: 'pigeon_v4', name: '毒鸽 (v4)', frames: 4 },
            { id: 'rabbit2_v2', name: '疯兔 (v2)', frames: 4 },
            { id: 'rabbit2_v4', name: '暴徒兔 (v4)', frames: 4 },
            { id: 'snail_v1', name: '蜗牛 (v1)', frames: 4 },
            { id: 'snail_v4', name: '铁壳蜗牛 (v4)', frames: 4 },
            { id: 'snake_v4', name: '毒蛇 (v4)', frames: 4 },
        ];
        
        // 解析怪物ID
        function parseMonsterId(fullId) {
            const parts = fullId.split('_');
            const version = parts.pop();
            const baseId = parts.join('_');
            return { baseId, version };
        }
        
        // 构建路径
        function buildPaths(monsterId) {
            const { baseId, version } = parseMonsterId(monsterId);
            const monster = floor1Monsters.find(m => m.id === monsterId);
            const frameCount = monster ? monster.frames : 4;
            
            const originalFrames = [];
            const styledFrames = [];
            
            for (let i = 1; i <= frameCount; i++) {
                const frameNum = i.toString().padStart(2, '0');
                originalFrames.push(`../generated_assets/monster_walk_curated_by_floor_reworked_v2/floor1/${baseId}/${version}/walk/f${frameNum}.png`);
                styledFrames.push(`../generated_assets/monster_walk_curated_by_floor_reworked_v2_styled/floor1/${baseId}/${version}/walk/f${frameNum}.png`);
            }
            
            return { originalFrames, styledFrames, frameCount };
        }
        
        // 状态
        let currentMonster = floor1Monsters[0];
        let isPlaying = true;
        let currentFrame = 0;
        let animationSpeed = 125;
        let scale = 2;
        let viewMode = 'sideBySide'; // 'sideBySide' | 'slider'
        let animationTimer = null;
        
        // 画布
        const canvasOriginal = document.getElementById('canvasOriginal');
        const canvasStyled = document.getElementById('canvasStyled');
        const ctxOriginal = canvasOriginal.getContext('2d');
        const ctxStyled = canvasStyled.getContext('2d');
        
        // 图像缓存
        const imageCache = {};
        
        // 加载图像
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                if (imageCache[src]) {
                    resolve(imageCache[src]);
                    return;
                }
                const img = new Image();
                img.onload = () => {
                    imageCache[src] = img;
                    resolve(img);
                };
                img.onerror = () => reject(new Error(`Failed to load ${src}`));
                img.src = src;
            });
        }
        
        // 加载怪物帧
        async function loadMonsterFrames(monsterId) {
            const { originalFrames, styledFrames } = buildPaths(monsterId);
            
            try {
                const originalImgs = await Promise.all(originalFrames.map(loadImage));
                const styledImgs = await Promise.all(styledFrames.map(loadImage));
                
                return { originalImgs, styledImgs };
            } catch (e) {
                console.error('Load error:', e);
                return null;
            }
        }
        
        // 绘制帧
        function drawFrame() {
            const { originalFrames, styledFrames, frameCount } = buildPaths(currentMonster.id);
            
            const originalSrc = originalFrames[currentFrame % frameCount];
            const styledSrc = styledFrames[currentFrame % frameCount];
            
            const origImg = imageCache[originalSrc];
            const styledImg = imageCache[styledSrc];
            
            if (origImg) {
                ctxOriginal.clearRect(0, 0, canvasOriginal.width, canvasOriginal.height);
                const size = 256;
                const x = (canvasOriginal.width - size) / 2;
                const y = (canvasOriginal.height - size) / 2;
                ctxOriginal.drawImage(origImg, x, y, size, size);
            }
            
            if (styledImg) {
                ctxStyled.clearRect(0, 0, canvasStyled.width, canvasStyled.height);
                const size = 256;
                const x = (canvasStyled.width - size) / 2;
                const y = (canvasStyled.height - size) / 2;
                ctxStyled.drawImage(styledImg, x, y, size, size);
            }
            
            // 更新拖拽对比
            if (viewMode === 'slider') {
                const beforeDiv = document.getElementById('sliderBefore');
                const afterDiv = document.getElementById('sliderAfter');
                if (origImg) beforeDiv.style.backgroundImage = `url(${originalSrc})`;
                if (styledImg) afterDiv.style.backgroundImage = `url(${styledSrc})`;
            }
        }
        
        // 动画循环
        function startAnimation() {
            if (animationTimer) clearInterval(animationTimer);
            animationTimer = setInterval(() => {
                if (isPlaying) {
                    currentFrame++;
                    drawFrame();
                }
            }, animationSpeed);
        }
        
        // 切换怪物
        async function switchMonster(monster) {
            currentMonster = monster;
            currentFrame = 0;
            
            // 更新UI
            document.querySelectorAll('.monster-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.id === monster.id);
            });
            
            // 加载帧
            const frames = await loadMonsterFrames(monster.id);
            if (frames) {
                drawFrame();
                document.getElementById('infoOriginal').textContent = 
                    `${monster.name} | ${monster.frames}帧`;
                document.getElementById('infoStyled').textContent = 
                    `已优化 | 轮廓柔化/明暗压缩/色彩调整`;
            } else {
                document.getElementById('infoOriginal').textContent = '加载失败';
                document.getElementById('infoStyled').textContent = '加载失败';
            }
        }
        
        // 生成怪物按钮
        function initMonsterList() {
            const list = document.getElementById('monsterList');
            floor1Monsters.forEach(monster => {
                const btn = document.createElement('button');
                btn.className = 'monster-btn';
                btn.textContent = monster.name;
                btn.dataset.id = monster.id;
                if (monster.id === currentMonster.id) btn.classList.add('active');
                btn.onclick = () => switchMonster(monster);
                list.appendChild(btn);
            });
        }
        
        // 控制事件
        document.getElementById('speedSelect').onchange = (e) => {
            animationSpeed = parseInt(e.target.value);
            startAnimation();
        };
        
        document.getElementById('scaleSelect').onchange = (e) => {
            scale = parseInt(e.target.value);
            const size = 256 * scale / 2;
            canvasOriginal.width = size;
            canvasOriginal.height = size;
            canvasStyled.width = size;
            canvasStyled.height = size;
            drawFrame();
        };
        
        document.getElementById('playPauseBtn').onclick = (e) => {
            isPlaying = !isPlaying;
            e.target.textContent = isPlaying ? '⏸ 暂停' : '▶ 播放';
            e.target.classList.toggle('active', isPlaying);
        };
        
        // 视图模式切换
        document.getElementById('viewModeBtn').onclick = () => {
            viewMode = viewMode === 'sideBySide' ? 'slider' : 'sideBySide';
            document.getElementById('sideBySideView').style.display = 
                viewMode === 'sideBySide' ? 'flex' : 'none';
            document.getElementById('sliderView').classList.toggle('active', viewMode === 'slider');
            document.getElementById('viewModeBtn').textContent = 
                viewMode === 'sideBySide' ? '📊 切换拖拽对比' : '📊 切换并排对比';
            drawFrame();
        };
        
        // 拖拽对比功能
        const sliderWrapper = document.getElementById('sliderWrapper');
        const sliderHandle = document.getElementById('sliderHandle');
        const sliderAfter = document.getElementById('sliderAfter');
        let isDragging = false;
        
        sliderHandle.addEventListener('mousedown', () => isDragging = true);
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = sliderWrapper.getBoundingClientRect();
            let x = e.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            const percent = (x / rect.width) * 100;
            sliderHandle.style.left = percent + '%';
            sliderAfter.style.width = percent + '%';
        });
        
        // 初始化
        initMonsterList();
        switchMonster(currentMonster);
        startAnimation();
    </script>
</body>
</html>
