<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一层灰白菌丝样板概念 v0.34</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0a0b0d;
            --panel: rgba(18, 21, 26, 0.88);
            --line: rgba(255,255,255,0.08);
            --text: #f1ece1;
            --muted: #a7acae;
            --shadow: rgba(0,0,0,0.34);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            background:
                radial-gradient(circle at top, rgba(125, 135, 145, 0.10), transparent 30%),
                linear-gradient(180deg, #101318 0%, #0a0b0d 100%);
            color: var(--text);
            font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
        }

        .page {
            width: min(1480px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 54px;
        }

        .hero, .concept, .footer {
            border: 1px solid var(--line);
            border-radius: 28px;
            background: var(--panel);
            box-shadow: 0 22px 58px var(--shadow);
        }

        .hero {
            padding: 26px 28px;
            margin-bottom: 20px;
        }

        .eyebrow {
            color: #d2c5b0;
            font-size: 12px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1, h2, h3 {
            margin: 0;
            font-family: "Palatino Linotype", "Book Antiqua", "Microsoft YaHei UI", serif;
        }

        h1 {
            font-size: clamp(32px, 4vw, 54px);
            line-height: 1.05;
            margin-bottom: 12px;
        }

        .lead {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.85;
            max-width: 1020px;
        }

        .concepts {
            display: grid;
            gap: 18px;
        }

        .concept {
            overflow: hidden;
        }

        .concept-head {
            padding: 22px 24px 18px;
            border-bottom: 1px solid var(--line);
            background: radial-gradient(circle at right top, color-mix(in srgb, var(--accent) 24%, transparent), transparent 45%);
        }

        .concept-title {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .concept-index {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: color-mix(in srgb, var(--accent) 20%, rgba(255,255,255,0.03));
            border: 1px solid color-mix(in srgb, var(--accent) 40%, rgba(255,255,255,0.06));
        }

        .concept-sub {
            color: color-mix(in srgb, var(--accent) 60%, #e5dccf);
            font-size: 14px;
        }

        .concept-summary {
            margin-top: 12px;
            color: var(--muted);
            line-height: 1.8;
            max-width: 980px;
        }

        .concept-body {
            display: grid;
            grid-template-columns: minmax(380px, 1.08fr) minmax(0, 1fr);
            gap: 18px;
            padding: 20px;
        }

        .scene {
            position: relative;
            min-height: 440px;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            background:
                radial-gradient(circle at 50% 8%, rgba(198, 207, 221, 0.06), transparent 34%),
                linear-gradient(180deg, #10151c 0%, #090b0f 100%);
        }

        .back-depth, .frame, .stage, .vignette, .fog, .foreground, .glow {
            position: absolute;
        }

        .back-depth {
            inset: 4% 6% 18%;
            border-radius: 34px 34px 22px 22px;
            background:
                radial-gradient(circle at 50% 18%, var(--far-glow), transparent 22%),
                radial-gradient(circle at 50% 30%, rgba(240,244,250,0.05), transparent 14%),
                linear-gradient(180deg, var(--back-top), var(--back-bottom));
            opacity: 0.92;
            filter: blur(10px);
        }

        .frame {
            inset: 8%;
            border-radius: 32px;
            background:
                linear-gradient(180deg, var(--frame-top), var(--frame-bottom));
            box-shadow:
                inset 0 0 0 2px rgba(255,255,255,0.03),
                inset 0 28px 42px rgba(255,255,255,0.03),
                inset 0 -30px 46px rgba(0,0,0,0.34);
        }

        .frame::before,
        .frame::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
        }

        .frame::before {
            background:
                radial-gradient(circle at 16% 16%, var(--accent-soft), transparent 13%),
                radial-gradient(circle at 84% 16%, var(--accent-soft), transparent 13%),
                radial-gradient(circle at 84% 84%, var(--accent-soft), transparent 13%),
                radial-gradient(circle at 16% 84%, var(--accent-soft), transparent 13%);
            opacity: 0.75;
        }

        .stage {
            left: 50%;
            top: 50%;
            width: var(--stage-size);
            height: var(--stage-size);
            transform: translate(-50%, -46%);
            border-radius: 28px;
            background:
                radial-gradient(circle at 50% 52%, var(--stage-glow), transparent 55%),
                linear-gradient(180deg, var(--stage-top), var(--stage-bottom));
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.04),
                inset 0 0 68px rgba(0,0,0,0.24),
                0 18px 28px rgba(0,0,0,0.26);
        }

        .stage::before {
            content: "";
            position: absolute;
            inset: 10%;
            border-radius: 22px;
            background:
                repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 10px, rgba(0,0,0,0.02) 10px 18px);
            mix-blend-mode: screen;
            opacity: 0.36;
        }

        .door-top,
        .door-bottom {
            position: absolute;
            left: 50%;
            width: 15%;
            transform: translateX(-50%);
            border-radius: 26px;
            background:
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.10), transparent 34%),
                linear-gradient(180deg, var(--door-top), var(--door-bottom));
            box-shadow: 0 0 18px rgba(255,255,255,0.03);
        }

        .door-top { top: 9%; height: 14%; }
        .door-bottom { bottom: 9%; height: 12%; transform: translateX(-50%) rotate(180deg); }

        .fog {
            inset: 8%;
            border-radius: 34px;
            background:
                radial-gradient(circle at 50% 56%, rgba(255,255,255,0.10), transparent 18%),
                radial-gradient(circle at 50% 58%, var(--mist-soft), transparent 46%),
                radial-gradient(circle at 50% 58%, var(--mist-ring), transparent 72%);
            filter: blur(18px);
            opacity: 0.82;
        }

        .foreground {
            left: -2%;
            right: -2%;
            bottom: -4%;
            height: 26%;
            background:
                radial-gradient(circle at 15% 86%, var(--fg-solid), transparent 18%),
                radial-gradient(circle at 32% 92%, var(--fg-soft), transparent 20%),
                radial-gradient(circle at 68% 92%, var(--fg-soft), transparent 19%),
                radial-gradient(circle at 86% 86%, var(--fg-solid), transparent 18%);
            filter: blur(12px);
            opacity: var(--fg-opacity);
        }

        .glow {
            inset: 0;
            background:
                radial-gradient(circle at 50% 52%, rgba(255,255,255,0.06), transparent 12%),
                radial-gradient(circle at 50% 52%, var(--center-aura), transparent 26%);
            opacity: 0.74;
        }

        .vignette {
            inset: 0;
            background: radial-gradient(circle at 50% 54%, rgba(4,7,10,0) 0%, rgba(4,7,10,0) 18%, rgba(3,6,9,0.12) 44%, rgba(2,5,8,0.56) 100%);
            mix-blend-mode: multiply;
        }

        .notes {
            display: grid;
            gap: 14px;
        }

        .block {
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 14px 16px;
            background: rgba(255,255,255,0.03);
        }

        .block h3 {
            font-size: 15px;
            margin-bottom: 10px;
        }

        .block p, .block li {
            color: var(--muted);
            line-height: 1.75;
            font-size: 13px;
        }

        .block ul {
            margin: 0;
            padding-left: 18px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            padding: 7px 11px;
            border-radius: 999px;
            font-size: 12px;
            background: color-mix(in srgb, var(--accent) 18%, rgba(255,255,255,0.03));
            border: 1px solid color-mix(in srgb, var(--accent) 32%, rgba(255,255,255,0.06));
            color: #f4eee1;
        }

        .footer {
            margin-top: 18px;
            padding: 18px 20px;
            color: var(--muted);
            line-height: 1.8;
            font-size: 13px;
        }

        @media (max-width: 1100px) {
            .concept-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <section class="hero">
            <div class="eyebrow">Layer 1 Concept Board / v0.34</div>
            <h1>第一层灰白菌丝样板 三套方向</h1>
            <div class="lead">
                这不是最终原画，而是结构化概念板。目标是把第一层从“灰绿误读的平面房间”拉回“灰白菌丝洞穴舞台”，并直接比较三种不同的空间性格：稳、艺、雅。每套都围绕同一个问题展开：在你当前四角可见的中心舞台视角下，核心战斗区缩小后，外围洞穴框景要怎么成立。 
            </div>
        </section>

        <section class="concepts" id="concepts"></section>

        <section class="footer">
            推荐阅读顺序：先看 A 的结构稳定性，再看 B 的微缩电影感，最后看 C 的高级圣所结构。若要尽快推进正式样板，优先建议选 `A + B` 混合。 
        </section>
    </div>

    <script>
        const concepts = [
            {
                index: 'A',
                title: '灰白圣盒舞台',
                subtitle: '最稳的结构母版',
                summary: '保留当前方形舞台的可读性，把房间升级成被菌丝吞没的骨质匣体。它不是最花的，但最适合作为正式第一版样板。',
                tags: ['结构最稳', '可读性最高', '适合作为正式母版'],
                accent: '#c6bdb0',
                stageSize: '62%',
                frameTop: '#5f5a55',
                frameBottom: '#252323',
                backTop: '#394049',
                backBottom: '#161a1f',
                stageTop: '#9c9388',
                stageBottom: '#645d56',
                stageGlow: 'rgba(223, 215, 204, 0.12)',
                doorTop: '#aba295',
                doorBottom: '#5e5750',
                mistSoft: 'rgba(197, 191, 184, 0.12)',
                mistRing: 'rgba(104, 97, 90, 0.10)',
                fgSolid: 'rgba(86, 83, 78, 0.78)',
                fgSoft: 'rgba(124, 120, 112, 0.54)',
                fgOpacity: 0.72,
                centerAura: 'rgba(215, 207, 196, 0.12)',
                farGlow: 'rgba(216, 221, 233, 0.09)',
                accentSoft: 'rgba(255,255,255,0.05)',
                material: '地板是灰白菌丝覆盖的骨灰洞面，墙和转角是偏骨质的硬结构，门像嵌在厚壁里的菌膜裂口。',
                space: '核心方形仍然最明确，外围只做适度洞壁包裹和少量远景洞腔，属于“结构先成立”的方案。',
                light: '中间冷白弱亮，外围稳稳压暗，门外远处给一点微光，整体偏静、偏冷、偏压抑。'
            },
            {
                index: 'B',
                title: '菌丝标本箱',
                subtitle: '最强的微缩电影感',
                summary: '承认当前移轴天然有标本盒和微缩舞台感，直接把房间设计成被观看的活体洞穴展柜。它艺术感最强，也最容易出现“电影镜头感”。',
                tags: ['微缩感最强', '最适合移轴', '艺术感最高'],
                accent: '#d7d0c4',
                stageSize: '56%',
                frameTop: '#68635f',
                frameBottom: '#202021',
                backTop: '#445062',
                backBottom: '#15181f',
                stageTop: '#a8a095',
                stageBottom: '#5f5a54',
                stageGlow: 'rgba(232, 227, 219, 0.14)',
                doorTop: '#b9b0a4',
                doorBottom: '#67625b',
                mistSoft: 'rgba(224, 219, 212, 0.16)',
                mistRing: 'rgba(136, 128, 118, 0.11)',
                fgSolid: 'rgba(67, 66, 64, 0.84)',
                fgSoft: 'rgba(154, 149, 140, 0.58)',
                fgOpacity: 0.90,
                centerAura: 'rgba(226, 220, 211, 0.14)',
                farGlow: 'rgba(219, 232, 255, 0.10)',
                accentSoft: 'rgba(255,255,255,0.06)',
                material: '地板更像被长久封存的灰白有机层，墙是洞腔切面，转角更圆、更生长化，门像被撕开的活体膜层。',
                space: '核心舞台更小，外围框景更宽，下方前景菌丝幕和碎骨遮挡更明显，上方则是更深的菌腔背景。',
                light: '亮区更柔，外围更暗，孢子和门外微光提供空气感，让整个空间更像一个被镜头观察的标本箱。'
            },
            {
                index: 'C',
                title: '灰白圣所裂腔',
                subtitle: '最接近高级 JRPG 空间',
                summary: '借一点《八方旅人》的高级舞台空间感，但不做真等距，而是在当前视角里加更精致的折面和阈值秩序。',
                tags: ['结构最雅', '最接近圣所感', '后续高层扩展力强'],
                accent: '#d2c6b7',
                stageSize: '60%',
                frameTop: '#6b6660',
                frameBottom: '#232124',
                backTop: '#404b57',
                backBottom: '#14181d',
                stageTop: '#a89f94',
                stageBottom: '#6c645c',
                stageGlow: 'rgba(218, 212, 204, 0.12)',
                doorTop: '#b3ab9d',
                doorBottom: '#615b55',
                mistSoft: 'rgba(204, 200, 192, 0.13)',
                mistRing: 'rgba(120, 114, 106, 0.10)',
                fgSolid: 'rgba(77, 74, 72, 0.64)',
                fgSoft: 'rgba(140, 134, 126, 0.46)',
                fgOpacity: 0.58,
                centerAura: 'rgba(214, 208, 198, 0.11)',
                farGlow: 'rgba(220, 229, 243, 0.09)',
                accentSoft: 'rgba(255,255,255,0.045)',
                material: '地板菌丝更有秩序，墙是骨质硬壳与菌丝纹交替，转角像折面节点，门像裂开的骨膜拱口。',
                space: '四角和墙的关系更像被设计过的结构面，前景更克制，重点在门外深处的洞宫引导感。',
                light: '中景更清晰，暗部更稳，门外远处给一点冷白引导，整体更像“艺术化洞穴圣所”。'
            }
        ];

        const container = document.getElementById('concepts');
        container.innerHTML = concepts.map((c) => `
            <section class="concept" style="
                --accent:${c.accent};
                --stage-size:${c.stageSize};
                --frame-top:${c.frameTop};
                --frame-bottom:${c.frameBottom};
                --back-top:${c.backTop};
                --back-bottom:${c.backBottom};
                --stage-top:${c.stageTop};
                --stage-bottom:${c.stageBottom};
                --stage-glow:${c.stageGlow};
                --door-top:${c.doorTop};
                --door-bottom:${c.doorBottom};
                --mist-soft:${c.mistSoft};
                --mist-ring:${c.mistRing};
                --fg-solid:${c.fgSolid};
                --fg-soft:${c.fgSoft};
                --fg-opacity:${c.fgOpacity};
                --center-aura:${c.centerAura};
                --far-glow:${c.farGlow};
                --accent-soft:${c.accentSoft};
            ">
                <div class="concept-head">
                    <div class="concept-title">
                        <div class="concept-index">${c.index}</div>
                        <h2>${c.title}</h2>
                        <div class="concept-sub">${c.subtitle}</div>
                    </div>
                    <div class="concept-summary">${c.summary}</div>
                    <div class="tags">${c.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
                </div>
                <div class="concept-body">
                    <div class="scene">
                        <div class="back-depth"></div>
                        <div class="frame">
                            <div class="door-top"></div>
                            <div class="door-bottom"></div>
                        </div>
                        <div class="stage"></div>
                        <div class="fog"></div>
                        <div class="glow"></div>
                        <div class="foreground"></div>
                        <div class="vignette"></div>
                    </div>
                    <div class="notes">
                        <div class="block">
                            <h3>材质骨架</h3>
                            <p>${c.material}</p>
                        </div>
                        <div class="block">
                            <h3>空间布局</h3>
                            <p>${c.space}</p>
                        </div>
                        <div class="block">
                            <h3>光照情绪</h3>
                            <p>${c.light}</p>
                        </div>
                    </div>
                </div>
            </section>
        `).join('');
    </script>
</body>
</html>
